openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: content
  - name: products
  - name: orders
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /content:
    get:
      operationId: getContent
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/School"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteContent" }
    put:
      operationId: updateContent
      tags: [content]
      parameters:
        - $ref: "#/components/parameters/School"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateSiteContent" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteContent" }
  /products:
    get:
      operationId: listProducts
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/School"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      parameters:
        - $ref: "#/components/parameters/School"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProduct" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    put:
      operationId: updateProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProduct" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
    delete:
      operationId: deleteProduct
      tags: [products]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/School"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }
    post:
      operationId: createOrder
      tags: [orders]
      parameters:
        - $ref: "#/components/parameters/School"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatus" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
    delete:
      operationId: deleteOrder
      tags: [orders]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
  /email/test:
    post:
      operationId: sendTestEmail
      tags: [content]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendTestEmail" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailTestResult" }
  /orders/summary:
    get:
      operationId: getOrdersSummary
      tags: [orders]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdersSummary" }
components:
  parameters:
    School:
      name: school
      in: query
      required: false
      schema:
        type: string
        enum: [alvarado, shelyn]
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]
    SiteContent:
      type: object
      properties:
        id: { type: integer }
        school: { type: string, enum: [alvarado, shelyn] }
        checkoutFields:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              required: { type: boolean }
            required: [id, label, required]
        brandName: { type: string }
        navHomeLabel: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        coverImageUrl: { type: string }
        aboutHeading: { type: string }
        aboutBody: { type: string }
        authorsLine: { type: string }
        illustratorLine: { type: string }
        footerNote: { type: string }
        accentColor: { type: string }
        defaultShippingLabel: { type: string }
        defaultShippingAddress: { type: string }
        defaultShippingCity: { type: string }
        defaultShippingPostalCode: { type: string }
        defaultShippingCountry: { type: string }
        ordersEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        emailFromName: { type: string }
        emailFromAddress: { type: string }
        emailReplyTo: { type: string }
        emailSubject: { type: string }
        emailHeading: { type: string }
        emailIntro: { type: string }
        emailButtonLabel: { type: string }
        emailFooter: { type: string }
        emailAccentColor: { type: string }
        blogTitle: { type: string }
        blogSubtitle: { type: string }
        blogDate: { type: string }
        blogHeroImageUrl: { type: string }
        blogBody: { type: string }
        updatedAt: { type: string }
      required: [id, school, checkoutFields, brandName, navHomeLabel, heroTitle, heroSubtitle, ctaLabel, ctaUrl, coverImageUrl, aboutHeading, aboutBody, authorsLine, illustratorLine, footerNote, accentColor, defaultShippingLabel, defaultShippingAddress, defaultShippingCity, defaultShippingPostalCode, defaultShippingCountry, ordersEnabled, emailEnabled, emailFromName, emailFromAddress, emailReplyTo, emailSubject, emailHeading, emailIntro, emailButtonLabel, emailFooter, emailAccentColor, blogTitle, blogSubtitle, blogDate, blogHeroImageUrl, blogBody, updatedAt]
    UpdateSiteContent:
      type: object
      properties:
        checkoutFields:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              required: { type: boolean }
            required: [id, label, required]
        brandName: { type: string }
        navHomeLabel: { type: string }
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        ctaLabel: { type: string }
        ctaUrl: { type: string }
        coverImageUrl: { type: string }
        aboutHeading: { type: string }
        aboutBody: { type: string }
        authorsLine: { type: string }
        illustratorLine: { type: string }
        footerNote: { type: string }
        accentColor: { type: string }
        defaultShippingLabel: { type: string }
        defaultShippingAddress: { type: string }
        defaultShippingCity: { type: string }
        defaultShippingPostalCode: { type: string }
        defaultShippingCountry: { type: string }
        ordersEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        emailFromName: { type: string }
        emailFromAddress: { type: string }
        emailReplyTo: { type: string }
        emailSubject: { type: string }
        emailHeading: { type: string }
        emailIntro: { type: string }
        emailButtonLabel: { type: string }
        emailFooter: { type: string }
        emailAccentColor: { type: string }
        blogTitle: { type: string }
        blogSubtitle: { type: string }
        blogDate: { type: string }
        blogHeroImageUrl: { type: string }
        blogBody: { type: string }
      required: [brandName, navHomeLabel, heroTitle, heroSubtitle, ctaLabel, ctaUrl, coverImageUrl, aboutHeading, aboutBody, authorsLine, illustratorLine, footerNote, accentColor, defaultShippingLabel, defaultShippingAddress, defaultShippingCity, defaultShippingPostalCode, defaultShippingCountry, ordersEnabled, emailEnabled, emailFromName, emailFromAddress, emailReplyTo, emailSubject, emailHeading, emailIntro, emailButtonLabel, emailFooter, emailAccentColor, blogTitle, blogSubtitle, blogDate, blogHeroImageUrl, blogBody]
    Product:
      type: object
      properties:
        id: { type: integer }
        school: { type: string, enum: [alvarado, shelyn] }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        currency: { type: string }
        imageUrl: { type: string }
        stock: { type: integer }
        active: { type: boolean }
        createdAt: { type: string }
      required: [id, school, name, description, priceCents, currency, imageUrl, stock, active, createdAt]
    CreateProduct:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        imageUrl: { type: string }
        stock: { type: integer, minimum: 0 }
        active: { type: boolean }
      required: [name, description, priceCents, currency, imageUrl, stock, active]
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        quantity: { type: integer }
        unitPriceCents: { type: integer }
      required: [id, productId, productName, quantity, unitPriceCents]
    Order:
      type: object
      properties:
        id: { type: integer }
        school: { type: string, enum: [alvarado, shelyn] }
        customerName: { type: string }
        customerEmail: { type: string }
        customerPhone: { type: string }
        shippingAddress: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }
        classroom: { type: string }
        useDefaultAddress: { type: boolean }
        notes: { type: string }
        customFields: { type: object, additionalProperties: { type: string } }
        paymentMethod: { type: string }
        orderType: { type: string, enum: [sale, preorder] }
        paymentStatus: { type: string, enum: [due, due_later, paid] }
        status: { type: string }
        estimatedDeliveryDate: { type: string, format: date }
        subtotalCents: { type: integer }
        shippingCents: { type: integer }
        totalCents: { type: integer }
        currency: { type: string }
        createdAt: { type: string }
        utmSource: { type: string }
        utmMedium: { type: string }
        utmCampaign: { type: string }
        utmTerm: { type: string }
        utmContent: { type: string }
        referrer: { type: string }
        landingPage: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
      required: [id, school, customerName, customerEmail, customerPhone, shippingAddress, city, postalCode, country, useDefaultAddress, paymentMethod, orderType, paymentStatus, status, subtotalCents, shippingCents, totalCents, currency, createdAt, items]
    CreateOrderItem:
      type: object
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }
      required: [productId, quantity]
    CreateOrder:
      type: object
      properties:
        school: { type: string, enum: [alvarado, shelyn] }
        customerName: { type: string, minLength: 1 }
        customerEmail: { type: string, minLength: 3 }
        customerPhone: { type: string, minLength: 3 }
        useDefaultAddress: { type: boolean }
        shippingAddress: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }
        classroom: { type: string }
        notes: { type: string }
        customFields: { type: object, additionalProperties: { type: string } }
        orderType: { type: string, enum: [sale, preorder] }
        utmSource: { type: string }
        utmMedium: { type: string }
        utmCampaign: { type: string }
        utmTerm: { type: string }
        utmContent: { type: string }
        referrer: { type: string }
        landingPage: { type: string }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CreateOrderItem" }
      required: [school, customerName, customerEmail, customerPhone, useDefaultAddress, items]
    UpdateOrderStatus:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        estimatedDeliveryDate:
          type: string
          format: date
      required: [status]
    SendTestEmail:
      type: object
      properties:
        to: { type: string, minLength: 3 }
      required: [to]
    EmailTestResult:
      type: object
      properties:
        ok: { type: boolean }
        emailId: { type: string }
        message: { type: string }
      required: [ok]
    OrdersSummary:
      type: object
      properties:
        totalOrders: { type: integer }
        pendingOrders: { type: integer }
        revenueCents: { type: integer }
        currency: { type: string }
      required: [totalOrders, pendingOrders, revenueCents, currency]
