kind = "web"
previewPath = "/backend/"
title = "AFEON Admin"
version = "1.0.0"
id = "artifacts/backend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/backend/" ]
localPort = 9000

[services.development]
run = "pnpm --filter @workspace/backend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/backend", "run", "build" ]
publicDir = "artifacts/backend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "9000"
BASE_PATH = "/backend/"
