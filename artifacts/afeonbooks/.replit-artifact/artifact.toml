kind = "web"
previewPath = "/pickup/"
title = "AFEON Pickup"
version = "1.0.0"
id = "artifacts/afeonbooks"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pickup/" ]
localPort = 23360

[services.development]
run = "pnpm --filter @workspace/afeonbooks run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/afeonbooks", "run", "build" ]
publicDir = "artifacts/afeonbooks/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23360"
BASE_PATH = "/pickup/"
